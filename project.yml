# Xcode project definition. Generate Meowchi.xcodeproj with ./ProjeyiAc.command (runs `xcodegen generate`).
# The .xcodeproj is not committed. Version: MARKETING_VERSION below; the build number comes from the
# release workflow (100 + run number).
name: Meowchi
options:
  bundleIdPrefix: com.othinks
  xcodeVersion: "15.2"  # keep the project openable on the local Mac
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
knownRegions: [en, Base, tr, es, de, ja, ko, fr]

settings:
  base:
    DEVELOPMENT_TEAM: 24RD5ZN5HX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Meowchi:
    type: application
    platform: iOS
    sources:
      - path: Meowchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.othinks.Meowchi
        CODE_SIGN_ENTITLEMENTS: Meowchi/Meowchi.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meowchi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.simulation-games
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # No custom encryption: TestFlight skips the export-compliance question.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: Meowchi/Info.plist
      properties:
        # Keep the pixel-art look when built with the iOS 26 SDK (no automatic Liquid Glass restyle).
        UIDesignRequiresCompatibility: true
    dependencies:
      - target: MeowchiWidget

  MeowchiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MeowchiWidget
      - path: Meowchi/Services/Widget/WidgetSnapshot.swift
        group: MeowchiWidget/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.othinks.Meowchi.widget
        CODE_SIGN_ENTITLEMENTS: MeowchiWidget/MeowchiWidget.entitlements
        INFOPLIST_FILE: MeowchiWidget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Meowchi
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]

  MeowchiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MeowchiTests
    dependencies:
      - target: Meowchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.othinks.Meowchi.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  Meowchi:
    build:
      targets:
        Meowchi: all
        MeowchiTests: [test]
    test:
      config: Debug
      targets: [MeowchiTests]
    run:
      config: Debug
    archive:
      config: Release
