name: Ekran görüntüleri

# Elle başlatılır: GitHub → Actions → "Ekran görüntüleri" → Run workflow.
# 6,9" iPhone simülatöründe 7 dilde 7'şer App Store ekran görüntüsü çeker. Sonuç, çalıştırma
# sayfasında "screenshots" adlı indirilebilir dosya olarak durur. "upload" seçilirse
# App Store Connect'e de yüklenir (mevcutların yerine).
on:
  # Runs once when this workflow or the screenshot test changes on the working branch (no upload).
  push:
    branches: [phase-5f-ux-7j2o0i]
    paths:
      - .github/workflows/screenshots.yml
      - MeowchiUITests/**
  workflow_dispatch:
    inputs:
      version:
        description: "App Store sürümü (ör. 1.0.0)"
        type: string
        required: false
        default: "1.0"
      upload:
        description: "App Store Connect'e yükle"
        type: boolean
        default: false

permissions:
  contents: write   # görüntüleri store-screenshots dalına kaydetmek için

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode 26'yı seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Xcode projesini üret
        run: ./ProjeyiAc.command

      - name: 6,9" simülatörü hazırla
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in data if "iOS" in r), key=lambda r: [int(x) for x in r.split("iOS-")[-1].split("-")], reverse=True)
          for runtime in ios:
              for device in data[runtime]:
                  if "Pro Max" in device["name"]:
                      print(device["udid"], device["name"], runtime, file=sys.stderr)
                      print(device["udid"]); sys.exit()
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Testleri derle
        run: |
          xcodebuild build-for-testing -project Meowchi.xcodeproj -scheme Meowchi \
            -destination "id=$DEVICE_ID" -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:" build.log | head -30; tail -40 build.log; exit 1; }

      - name: 7 dilde çek
        run: |
          set -e
          mkdir -p results
          for spec in "en-US en en_US" "tr tr tr_TR" "es-ES es es_ES" "de-DE de de_DE" "ja ja ja_JP" "ko ko ko_KR" "fr-FR fr fr_FR"; do
            set -- $spec
            echo "== $1"
            TEST_RUNNER_MEOWCHI_SCREENSHOTS=1 TEST_RUNNER_MEOWCHI_LANG="$2" TEST_RUNNER_MEOWCHI_LOCALE="$3" \
            xcodebuild test-without-building -project Meowchi.xcodeproj -scheme Meowchi \
              -destination "id=$DEVICE_ID" -derivedDataPath build/dd \
              -only-testing:MeowchiUITests/ScreenshotTests \
              -resultBundlePath "results/$1.xcresult" > "results/$1.log" 2>&1 \
              || { tail -40 "results/$1.log"; FAILED="$FAILED $1"; }
            xcrun xcresulttool export attachments --path "results/$1.xcresult" --output-path "results/$1"
          done
          python3 Tools/collect_screenshots.py results fastlane/screenshots
          echo "FAILED=$FAILED" >> "$GITHUB_ENV"

      - name: Başlık ve çerçeve ekle
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pillow
          /tmp/venv/bin/python Tools/frame_screenshots.py fastlane/screenshots

      - name: store-screenshots dalına kaydet
        run: |
          # Önizleme: her dilin görüntüleri küçültülüp yan yana (inceleme için)
          rm -rf /tmp/shots && cp -R fastlane/screenshots /tmp/shots
          python3 Tools/collect_screenshots.py --contact-sheet /tmp/shots
          # Teşhis: simülatörde uygulama çöktüyse çökme raporları ve test kayıtları
          mkdir -p /tmp/shots/_diagnostics
          cp results/*.log /tmp/shots/_diagnostics/ 2>/dev/null || true
          find ~/Library/Logs/DiagnosticReports -name "Meowchi*" -newer build.log -exec cp {} /tmp/shots/_diagnostics/ \; 2>/dev/null || true
          ls /tmp/shots/_diagnostics
          # Yalnızca görüntüler: derleme klasörleri dala karışmasın diye ayrı, boş bir depodan gönderilir
          REMOTE=$(git remote get-url origin)
          AUTH=$(git config --get http.https://github.com/.extraheader)
          cd /tmp/shots
          git init -q -b store-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "App Store ekran görüntüleri (${GITHUB_SHA::7})"
          git -c http.https://github.com/.extraheader="$AUTH" push -f "$REMOTE" store-screenshots

      - name: Başarısız dil varsa durdur
        if: env.FAILED != ''
        run: |
          echo "Başarısız diller:$FAILED"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: fastlane/screenshots

      - name: App Store Connect'e yükle
        if: inputs.upload
        run: |
          python3 - <<'PY'
          import json, os
          json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"],
                     "key": os.environ["ASC_PRIVATE_KEY"], "in_house": False},
                    open(os.path.expanduser("~/asc_key.json"), "w"))
          PY
          fastlane deliver --api_key_path ~/asc_key.json --app_identifier "${{ vars.APP_BUNDLE_ID || 'com.othinks.Meowchi' }}" \
            --platform ios --app_version "${{ inputs.version }}" --screenshots_path fastlane/screenshots \
            --skip_binary_upload true --skip_metadata true --skip_screenshots false --overwrite_screenshots true \
            --run_precheck_before_submit false --submit_for_review false --force true
          rm -f ~/asc_key.json
