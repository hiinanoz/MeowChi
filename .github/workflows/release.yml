name: App Store'a yükle

# Elle başlatılır: GitHub → Actions → "App Store'a yükle" → Run workflow.
# Uygulamayı Xcode 26 ile derler, imzalar ve App Store Connect'e (TestFlight) gönderir.
#
# Gerekli depo sırları (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       Apple Developer Team ID (10 karakter)
#   ASC_KEY_ID          App Store Connect API anahtarının Key ID'si
#   ASC_ISSUER_ID       App Store Connect API Issuer ID
#   ASC_PRIVATE_KEY     İndirilen AuthKey_XXXX.p8 dosyasının içeriği (tamamı)
# Sırlar yoksa yalnızca imzasız arşiv denenir (yükleme yapılmaz).
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Bu sürüm için kısa not (isteğe bağlı)"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode 26'yı seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::Bu çalıştırıcıda Xcode 26 yok"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: İçerik ve çevirileri doğrula
        run: |
          python3 Tools/validate_strings.py
          # Eksikler (test reklam kimlikleri vb.) TestFlight için engel değil, App Store incelemesi için engel
          python3 Tools/release_check.py || echo "::warning::Yayın öncesi eksikler var (yukarıda). TestFlight için sorun değil; App Store'a göndermeden önce tamamlanmalı."

      - name: Xcode projesini üret
        run: ./ProjeyiAc.command

      - name: Derleme numarası
        run: |
          # Her yükleme benzersiz ve artan bir numara ister: bu iş akışının çalıştırma sayısı
          BUILD=$((100 + GITHUB_RUN_NUMBER))
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "Sürüm: $(grep -E '^ +MARKETING_VERSION:' project.yml | head -1 | tr -d ' ') · Derleme: $BUILD"

      - name: Sırları kontrol et
        run: |
          if [ -n "$APPLE_TEAM_ID" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            # Stray spaces or newlines in a pasted secret break signing; trim them.
            for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do
              value=$(printf '%s' "${!name}" | tr -d '[:space:]')
              [ "$value" = "${!name}" ] || echo "::warning::$name boşluk/satır sonu içeriyordu (temizlendi)"
              echo "::add-mask::$value"
              echo "$name=$value" >> "$GITHUB_ENV"
              printf -v "$name" '%s' "$value"
            done
            PROJECT_TEAM=$(grep -E '^ +DEVELOPMENT_TEAM:' project.yml | head -1 | awk '{print $2}')
            if [ "$APPLE_TEAM_ID" != "$PROJECT_TEAM" ]; then
              echo "::warning::APPLE_TEAM_ID sırrı project.yml'deki takım kimliğiyle aynı değil (uzunluk ${#APPLE_TEAM_ID})"
            else
              echo "Takım kimliği project.yml ile aynı"
            fi
            echo "ASC_KEY_ID uzunluk: ${#ASC_KEY_ID} (10 olmalı) · ASC_ISSUER_ID uzunluk: ${#ASC_ISSUER_ID} (36 olmalı)"
            echo "SIGNED=1" >> "$GITHUB_ENV"
            mkdir -p ~/private_keys
            printf '%s\n' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
            echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::Sırlar eksik: yalnızca imzasız deneme arşivi yapılacak, yükleme yok."
          fi

      - name: Arşivle
        run: |
          # Arşiv yerel (ad hoc, "-") imzayla oluşturulur: geliştirme profili ve kayıtlı test cihazı
          # gerekmez, gömülü çerçeveler de imzalı kalır. Asıl imza dışa aktarmada (App Store
          # dağıtım sertifikası ve profiliyle) atılır.
          xcodebuild archive \
            -project Meowchi.xcodeproj \
            -scheme Meowchi \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/Meowchi.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="" > archive.log 2>&1 || { grep -E "error:" archive.log | head -40; tail -60 archive.log; exit 1; }
          grep -E "\*\* ARCHIVE" archive.log
          plutil -p build/Meowchi.xcarchive/Products/Applications/Meowchi.app/Info.plist | grep -E "CFBundle(ShortVersionString|Version|Identifier)\"|DTSDKName|DTXcode\""

      - name: App Store Connect'e yükle
        if: env.SIGNED == '1'
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Meowchi.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1 || { grep -E "error" export.log | head -40; tail -60 export.log; exit 1; }
          tail -15 export.log
          echo "::notice::Derleme $BUILD_NUMBER App Store Connect'e yüklendi. İşlenmesi 10-30 dakika sürer; sonra TestFlight'ta görünür."

      - name: Hata ayrıntısı (dağıtım günlükleri)
        if: failure()
        run: |
          ls -la ~/private_keys || true
          # Key file shape only (no content): line count, header/footer present, CR characters
          if [ -n "$ASC_KEY_PATH" ] && [ -f "$ASC_KEY_PATH" ]; then
            echo "satır: $(wc -l < "$ASC_KEY_PATH")  CR: $(tr -cd '\r' < "$ASC_KEY_PATH" | wc -c)"
            head -1 "$ASC_KEY_PATH" | grep -q "BEGIN PRIVATE KEY" && echo "başlık var" || echo "BAŞLIK YOK"
            tail -1 "$ASC_KEY_PATH" | grep -q "END PRIVATE KEY" && echo "son satır var" || echo "SON SATIR YOK"
          fi
          for d in $(find /var/folders "$TMPDIR" -maxdepth 6 -name "*.xcdistributionlogs" 2>/dev/null | sort -u); do
            ls "$d"
            grep -h -n -B12 -A4 "Authentication failed" "$d"/IDEDistribution.verbose.log "$d"/IDEDistributionProvisioning.log 2>/dev/null \
              | grep -v -i "privatekey\|BEGIN\|eyJ\|Bearer\|\"related\"\|\"self\"" | cut -c1-300 | head -120
          done

      - name: Anahtarı sil
        if: always()
        run: rm -rf ~/private_keys
